# Origin is loopback-only; only the trusted Cloudflare connector reaches it publicly.
# Cloudflare overwrites CF-Connecting-IP. Do not expose this origin directly.
map $http_cf_connecting_ip $smap_client_ip {
    default $remote_addr;
    ~^[0-9a-fA-F:.]+$ $http_cf_connecting_ip;
}
limit_req_zone $smap_client_ip zone=auth_requests:10m rate=60r/m;
server {
    listen 80;
    server_name smartmap.tech www.smartmap.tech localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 5m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;

    location /api/ {
        proxy_pass http://smap-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_set_header X-Forwarded-For $smap_client_ip;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    location /identity/ {
        limit_req zone=auth_requests burst=20 nodelay;
        proxy_pass http://smap-auth:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /identity;
        proxy_set_header X-Forwarded-For $smap_client_ip;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
